name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # मैन्युअल रन करने के लिए बटन

jobs:
  build:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. रिपॉजिटरी कोड चेकआउट करें
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17 सेटअप करें (Gradle के लिए आवश्यक)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Node.js वातावरण तैयार करें
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. वेब फाइलों को पैकेज करें और Capacitor इंजन सेटअप करें
      - name: Prepare Android Project
        run: |
          mkdir -p www
          cp index.html www/
          [ -f manifest.json ] && cp manifest.json www/
          
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          
          # Capacitor कॉन्फ़िगरेशन बनाएं
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mandibhav.app",
            "appName": "मंडी भाव दर्पण",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF

          # Android प्लेटफॉर्म जोड़ें
          npx cap add android

      # 5. Gradle को रन करने की परमिशन दें
      - name: Grant Gradle Permissions
        run: |
          cd android
          chmod +x gradlew

      # 6. Android Debug APK बनाएं
      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # 7. तैयार APK को डाउनलोड के लिए सेव करें
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mandi-Bhav-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          
