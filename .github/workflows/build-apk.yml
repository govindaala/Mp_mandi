name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. रिपॉजिटरी कोड चेकआउट
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 21 सेटअप
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Node.js 22 सेटअप (एरर फिक्स)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 4. वेब फाइलों को पैकेज करें और Android प्रोजेक्ट बनाएं
      - name: Prepare Android Project
        run: |
          mkdir -p www
          cp index.html www/
          [ -f manifest.json ] && cp manifest.json www/
          
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mandibhav.app",
            "appName": "मंडी भाव दर्पण",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF

          npx cap add android

      # 5. Gradle को परमिशन दें
      - name: Grant Gradle Permissions
        run: |
          cd android
          chmod +x gradlew

      # 6. Android APK बनाएं
      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # 7. तैयार APK को डाउनलोड के लिए उपलब्ध कराएं
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mandi-Bhav-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
