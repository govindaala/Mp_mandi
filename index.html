<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>मंडी भाव</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js ग्राफ के लिए -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 pb-24 select-none font-sans">

  <!-- Header -->
  <header class="bg-emerald-700 text-white p-4 sticky top-0 z-40 shadow-md">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🌾</span>
        <div>
          <h1 class="text-lg font-bold leading-tight">मंडी भाव दर्पण</h1>
          <p class="text-[10px] text-emerald-200">सटीक व त्वरित भाव</p>
        </div>
      </div>
      <input type="date" id="dateFilter" class="bg-emerald-800 text-white text-xs px-2 py-1 rounded border border-emerald-600 focus:outline-none" />
    </div>

    <!-- Live Search -->
    <div class="mt-3 relative" id="searchContainer">
      <input type="text" id="searchInput" placeholder="फसल या मंडी खोजें (उदा. सोयाबीन, शामगढ़)..." 
        class="w-full bg-white text-gray-800 text-sm px-3 py-2 pl-9 rounded-xl shadow-inner focus:outline-none" />
      <span class="absolute left-3 top-2.5 text-gray-400 text-sm">🔍</span>
    </div>

    <!-- Mandi Filter Chips -->
    <div class="mt-2 flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar" id="filterPills">
      <button onclick="setMandiFilter(null)" class="filter-pill bg-white text-emerald-900 font-bold px-3 py-1.5 rounded-full shadow-sm whitespace-nowrap">सभी मंडियां</button>
      <button onclick="setMandiFilter(1)" class="filter-pill bg-emerald-800 text-white px-3 py-1.5 rounded-full whitespace-nowrap">शामगढ़</button>
      <button onclick="setMandiFilter(2)" class="filter-pill bg-emerald-800 text-white px-3 py-1.5 rounded-full whitespace-nowrap">मंदसौर</button>
      <button onclick="setMandiFilter(3)" class="filter-pill bg-emerald-800 text-white px-3 py-1.5 rounded-full whitespace-nowrap">भवानीमंडी</button>
    </div>
  </header>

  <!-- Content Sections (SPA Tabs) -->

  <!-- TAB 1: HOME / RATES LIST -->
  <section id="tab-home" class="p-3 space-y-3">
    <div id="ratesContainer">
      <div class="text-center py-10 text-gray-400 text-sm">डेटा लोड हो रहा है...</div>
    </div>
  </section>

  <!-- TAB 2: COMPARISON SCREEN -->
  <section id="tab-compare" class="p-3 space-y-4 hidden">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
      <h2 class="text-base font-bold text-gray-800 mb-3 flex items-center gap-2">
        <span>⚖️</span> मंडियों की तुलना करें
      </h2>
      <div class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-gray-500">फसल चुनें</label>
          <select id="compareCrop" class="w-full mt-1 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm">
            <option value="1">सोयाबीन (Soybean)</option>
            <option value="2">गेहूं (Wheat)</option>
            <option value="3">लहसुन (Garlic)</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">मंडी 1</label>
            <select id="compareMandi1" class="w-full mt-1 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm">
              <option value="1">शामगढ़</option>
              <option value="2">मंदसौर</option>
              <option value="3">भवानीमंडी</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">मंडी 2</label>
            <select id="compareMandi2" class="w-full mt-1 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm">
              <option value="3" selected>भवानीमंडी</option>
              <option value="1">शामगढ़</option>
              <option value="2">मंदसौर</option>
            </select>
          </div>
        </div>
        <button onclick="runComparison()" class="w-full bg-emerald-700 text-white font-semibold py-2.5 rounded-xl shadow-sm text-sm">
          तुलना देखें
        </button>
      </div>
    </div>

    <!-- Comparison Output -->
    <div id="compareResult" class="space-y-3"></div>
  </section>

  <!-- TAB 3: TRENDS & GRAPH -->
  <section id="tab-trend" class="p-3 space-y-4 hidden">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-base font-bold text-gray-800 flex items-center gap-2">
          <span>📈</span> मूल्य ट्रेंड व ग्राफ
        </h2>
        <select id="trendCropSelect" onchange="updateChart()" class="text-xs bg-gray-100 p-1.5 rounded-lg border-none font-semibold text-emerald-800">
          <option value="1">सोयाबीन</option>
          <option value="2">गेहूं</option>
          <option value="3">लहसुन</option>
        </select>
      </div>
      
      <div class="w-full h-64 relative">
        <canvas id="priceChart"></canvas>
      </div>
      <p class="text-[11px] text-gray-400 text-center mt-2">शामगढ़ मंडी - मॉडल भाव (गत 7 दिवस)</p>
    </div>
  </section>

  <!-- TAB 4: RATE ENTRY FORM -->
  <section id="tab-entry" class="p-3 space-y-4 hidden">
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
      <h2 class="text-base font-bold text-gray-800 mb-1 flex items-center gap-2">
        <span>✍️</span> दैनिक भाव प्रविष्टि
      </h2>
      <p class="text-xs text-gray-400 mb-4">अधिकृत ऑपरेटर / व्यापारी सीधे भाव दर्ज करें</p>

      <form id="entryForm" onsubmit="submitNewRate(event)" class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-gray-600">मंडी</label>
          <select id="formMandi" class="w-full mt-1 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" required>
            <option value="1">शामगढ़</option>
            <option value="2">मंदसौर</option>
            <option value="3">भवानीमंडी</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-semibold text-gray-600">फसल</label>
          <select id="formCommodity" class="w-full mt-1 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" required>
            <option value="1">सोयाबीन</option>
            <option value="2">गेहूं</option>
            <option value="3">लहसुन</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-semibold text-gray-600">भाव का प्रकार</label>
          <select id="formSource" class="w-full mt-1 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" required>
            <option value="GOVT_MANDI">सरकारी मंडी नीलामी</option>
            <option value="TRADER_OFFER">व्यापारी खरीद कोटेशन</option>
          </select>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="text-[11px] font-semibold text-gray-600">न्यूनतम (₹)</label>
            <input type="number" id="formMin" placeholder="4200" required class="w-full mt-1 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" />
          </div>
          <div>
            <label class="text-[11px] font-semibold text-gray-600">मॉडल/औसत (₹)</label>
            <input type="number" id="formModal" placeholder="4600" required class="w-full mt-1 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" />
          </div>
          <div>
            <label class="text-[11px] font-semibold text-gray-600">अधिकतम (₹)</label>
            <input type="number" id="formMax" placeholder="4850" required class="w-full mt-1 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" />
          </div>
        </div>

        <div>
          <label class="text-xs font-semibold text-gray-600">कुल आवक (बोरी में)</label>
          <input type="number" id="formArrival" placeholder="उदा. 450" class="w-full mt-1 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" />
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl shadow-md text-sm mt-2 transition">
          भाव दर्ज करें (Submit)
        </button>
      </form>
    </div>
  </section>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2.5 z-50 shadow-2xl">
    <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center text-emerald-700">
      <span class="text-xl">🏠</span>
      <span class="text-[11px] font-semibold">होम</span>
    </button>
    <button onclick="switchTab('compare')" id="nav-compare" class="nav-btn flex flex-col items-center text-gray-400">
      <span class="text-xl">⚖️</span>
      <span class="text-[11px] font-medium">तुलना</span>
    </button>
    <button onclick="switchTab('trend')" id="nav-trend" class="nav-btn flex flex-col items-center text-gray-400">
      <span class="text-xl">📈</span>
      <span class="text-[11px] font-medium">ट्रेंड</span>
    </button>
    <button onclick="switchTab('entry')" id="nav-entry" class="nav-btn flex flex-col items-center text-gray-400">
      <span class="text-xl">✍️</span>
      <span class="text-[11px] font-medium">भाव डालें</span>
    </button>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
